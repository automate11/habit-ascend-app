<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1fc8a9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="习惯进阶">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>习惯进阶</title>
<style>
:root{
  --bg1:#e9fbf0; --bg2:#fff5e8;
  --phone:#ffffff; --panel:rgba(255,255,255,.72); --glass:#ffffff;
  --line:rgba(46,42,58,.1);
  --text:#2e2a3a; --muted:#8a8398;
  --xp1:#1fc8a9; --xp2:#ffb800; --coin:#f5a623;
  --body:#ff6b81; --mind:#4d9bff; --creativity:#9b6dff; --life:#2ecc8f; --social:#ff8c42; --charm:#e056a0;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:linear-gradient(165deg,#dff7ea,#fff3e0 70%);
  display:flex;justify-content:center;padding:24px;min-height:100vh;color:var(--text);}
.phone{width:396px;background:var(--phone);border-radius:34px;overflow:hidden;
  box-shadow:0 22px 60px rgba(31,200,169,.18),0 0 0 1px rgba(255,255,255,.6);
  display:flex;flex-direction:column;height:850px;position:relative;}

/* HUD */
.hud{padding:14px 16px 12px;background:linear-gradient(180deg,rgba(31,200,169,.14),transparent);
  border-bottom:1px solid var(--line);}
.hud-top{display:flex;align-items:center;gap:11px;}
.badge{width:48px;height:48px;border-radius:15px;flex:0 0 auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(135deg,var(--xp1),var(--xp2));box-shadow:0 6px 16px rgba(31,200,169,.4);line-height:1;}
.badge small{font-size:8px;font-weight:600;opacity:.9;}
.hud-info{flex:1;}
.hud-title{font-size:14px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.hud-rt{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:14px;white-space:nowrap;}
.exp-txt{font-size:12px;letter-spacing:.3px;color:var(--muted);font-weight:600;}
.exp-txt span{font-weight:700;color:#5a6b8a;margin:0 1px;}
.coinpill{color:var(--coin);font-weight:800;font-size:12px;}
.exptrack{height:13px;border-radius:8px;margin:7px 0 5px;position:relative;overflow:hidden;
  background:rgba(46,42,58,.08);box-shadow:inset 0 1px 3px rgba(0,0,0,.08);}
.expfill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--xp1),var(--xp2));
  box-shadow:0 0 10px rgba(31,200,169,.5);width:60%;
  background-size:200% 100%;animation:flow 2.5s linear infinite;transition:width .5s cubic-bezier(.2,.9,.3,1);}
@keyframes flow{0%{background-position:0 0}100%{background-position:200% 0}}
.happy-bar{display:flex;align-items:center;gap:6px;margin-top:6px;padding:6px 12px;
  border-radius:12px;background:linear-gradient(135deg,#fff3e8,#ffe6d1,#ffd9b8);
  border:1.5px solid rgba(255,170,90,.35);box-shadow:0 2px 10px rgba(255,138,60,.18);
  transition:transform .15s,box-shadow .15s;}
.happy-bar .hb-emoji{font-size:18px;line-height:1;}
.happy-bar .hb-label{font-size:12px;font-weight:700;color:#d4823a;}
.happy-bar .hb-num{font-size:16px;font-weight:900;color:#ff6a1c;line-height:1;}
.happy-bar .hb-tag{font-size:10px;color:#c4885a;margin-left:auto;white-space:nowrap;}
.happy-bar.bump{animation:happyBump .7s ease;}
@keyframes happyBump{0%{transform:scale(1);box-shadow:0 2px 10px rgba(255,138,60,.18)}
  35%{transform:scale(1.04);box-shadow:0 0 22px rgba(255,106,28,.45)}
  100%{transform:scale(1);box-shadow:0 2px 10px rgba(255,138,60,.18)}}

.screen{flex:1;overflow-y:auto;padding:14px;display:none;}
.screen.active{display:block;}
.screen::-webkit-scrollbar{width:0;}
.sec-h{font-size:13px;font-weight:800;letter-spacing:1px;color:#1e9b86;margin:2px 0 12px;
  display:flex;align-items:center;gap:8px;}
.sec-h::before{content:"";width:4px;height:14px;border-radius:3px;background:linear-gradient(var(--xp1),var(--xp2));}
/* 任务分区（简洁头标 + 渐隐分割线，无底色） */
.ts{margin-bottom:14px;}
.ts-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px;}
.ts-badge{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.1);}
.ts-badge svg{width:14px;height:14px;}
.ts-name{font-size:13px;font-weight:800;letter-spacing:.3px;}
.ts-cnt{font-size:10px;color:var(--muted);margin-left:auto;background:rgba(46,42,58,.06);padding:2px 8px;border-radius:999px;font-weight:600;}
.ts-line{height:2px;border-radius:1px;margin-bottom:10px;}
.ts.long .ts-badge{background:linear-gradient(135deg,#4d9bff,#9b6dff);}
.ts.long .ts-name{color:#5060ff;}
.ts.long .ts-line{background:linear-gradient(90deg,rgba(77,155,255,.4),rgba(155,109,255,.2),transparent);}
.ts.temp .ts-badge{background:linear-gradient(135deg,#ff5e62,#ffa94d);}
.ts.temp .ts-name{color:#e8453a;}
.ts.temp .ts-line{background:linear-gradient(90deg,rgba(255,94,98,.4),rgba(255,169,77,.2),transparent);}

/* 今日达成度 */
.today-prog{border-radius:18px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,rgba(31,200,169,.16),rgba(255,184,0,.12));border:1px solid var(--line);}
.today-prog .tp-txt{flex:1;}
.today-prog .tp-big{font-size:15px;font-weight:800;}
.today-prog .tp-sub{font-size:11px;color:#5a8a7e;margin-top:4px;line-height:1.5;}

/* 今日通关奖励 */
.daily-bonus{border-radius:18px;padding:14px;margin-bottom:14px;position:relative;overflow:hidden;transition:.3s;}
.daily-bonus.locked{background:rgba(46,42,58,.04);border:1px dashed rgba(46,42,58,.2);}
.daily-bonus.ready{background:linear-gradient(135deg,rgba(245,166,35,.18),rgba(255,184,0,.14));border:1px solid rgba(245,166,35,.4);box-shadow:0 4px 18px rgba(245,166,35,.18);}
.daily-bonus.claimed{background:linear-gradient(135deg,rgba(31,200,169,.12),rgba(46,204,143,.08));border:1px solid rgba(31,200,169,.3);}
.daily-bonus .db-row{display:flex;align-items:center;gap:12px;}
.daily-bonus .db-ico{font-size:30px;flex:0 0 auto;width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);}
.daily-bonus.ready .db-ico{background:linear-gradient(135deg,#fff3d6,#ffe2c2);box-shadow:0 0 14px rgba(245,166,35,.4);animation:bonusPulse 1.8s ease-in-out infinite;}
@keyframes bonusPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.daily-bonus .db-info{flex:1;}
.daily-bonus .db-title{font-size:13px;font-weight:800;}
.daily-bonus .db-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}
.daily-bonus.ready .db-desc{color:#b9791a;}
.daily-bonus.claimed .db-desc{color:#1e9b86;}
.daily-bonus .db-claim{border:none;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:800;white-space:nowrap;cursor:pointer;transition:.15s;}
.daily-bonus.locked .db-claim{background:rgba(46,42,58,.08);color:var(--muted);cursor:not-allowed;}
.daily-bonus.ready .db-claim{background:linear-gradient(135deg,var(--coin),#ffd98a);color:#fff;box-shadow:0 4px 14px rgba(245,166,35,.4);}
.daily-bonus.ready .db-claim:active{transform:scale(.94);}
.daily-bonus.claimed .db-claim{background:rgba(31,200,169,.15);color:#1e9b86;cursor:default;}
.daily-bonus .db-edit{font-size:10px;color:var(--muted);cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block;}
/* 通关进度+奖励 合一卡 */
.daily-bonus .db-top{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.daily-bonus .db-ring{flex:0 0 auto;}
.daily-bonus .db-prog{flex:1;min-width:0;}
.daily-bonus .db-prog .dp-big{font-size:14px;font-weight:800;line-height:1.4;}
.daily-bonus .db-prog .dp-sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}
.daily-bonus.ready .db-prog .dp-sub{color:#b9791a;}
.daily-bonus.claimed .db-prog .dp-sub{color:#1e9b86;}
.daily-bonus .db-reward{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line);}
.daily-bonus .db-reward .dr-ico{font-size:22px;width:36px;height:36px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);}
.daily-bonus.ready .db-reward .dr-ico{background:linear-gradient(135deg,#fff3d6,#ffe2c2);}
.daily-bonus .db-reward .dr-info{flex:1;min-width:0;}
.daily-bonus .db-reward .dr-name{font-size:13px;font-weight:700;}
.daily-bonus .db-reward .dr-meta{font-size:11px;color:var(--muted);margin-top:2px;}
/* 奖励编辑表单 */
.bonus-edit .be-label{font-size:11px;color:#1e9b86;font-weight:700;margin:10px 0 6px;letter-spacing:.5px;}
.bonus-edit .be-presets{display:flex;flex-wrap:wrap;gap:6px;}
.bonus-edit .be-presets button{padding:7px 10px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;background:#fafbfa;border:1px solid var(--line);color:var(--muted);transition:.12s;}
.bonus-edit .be-presets button:hover{border-color:var(--xp1);background:rgba(31,200,169,.06);}
.bonus-edit .be-presets button.on{background:linear-gradient(135deg,var(--xp1),var(--xp2));color:#fff;border:none;box-shadow:0 3px 10px rgba(31,200,169,.25);}
.bonus-edit .be-ico-row{display:flex;flex-wrap:wrap;gap:4px;}
.bonus-edit .be-ico-row button{font-size:18px;border:1px solid var(--line);border-radius:8px;background:#fafbfa;padding:5px 8px;cursor:pointer;transition:.12s;}
.bonus-edit .be-ico-row button:hover{background:rgba(31,200,169,.1);}
.bonus-edit .be-ico-row button.on{border-color:var(--xp1);background:rgba(31,200,169,.18);box-shadow:0 0 0 2px rgba(31,200,169,.2);}
.bonus-edit .be-coins{display:flex;gap:8px;}
.bonus-edit .be-coins .field{flex:1;margin:0;}
.bonus-edit .be-coins .field label{font-size:10px;}

/* 通关节点路径（紧凑版：节点+连线+末尾奖励节点） */
.qpath{border-radius:16px;padding:11px 14px;margin-bottom:14px;transition:.3s;}
.qpath.locked{background:rgba(46,42,58,.04);border:1px dashed rgba(46,42,58,.18);}
.qpath.ready{background:linear-gradient(135deg,rgba(245,166,35,.16),rgba(255,184,0,.12));border:1px solid rgba(245,166,35,.4);box-shadow:0 4px 14px rgba(245,166,35,.14);}
.qpath.claimed{background:linear-gradient(135deg,rgba(31,200,169,.1),rgba(46,204,143,.06));border:1px solid rgba(31,200,169,.28);}
.qp-bar{display:flex;flex-wrap:wrap;align-items:center;gap:0;row-gap:6px;margin-bottom:7px;}
.qp-cell{display:flex;align-items:center;flex:1;min-width:28px;}
.qp-node{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:0 0 auto;border:2px solid rgba(46,42,58,.16);background:#fafbfa;color:var(--muted);transition:.25s;z-index:1;}
.qp-node.done{background:linear-gradient(135deg,var(--xp1),var(--xp2));border-color:transparent;color:#fff;box-shadow:0 0 7px rgba(31,200,169,.35);}
.qp-line{height:3px;flex:1;border-radius:2px;background:rgba(46,42,58,.1);transition:.3s;min-width:6px;}
.qp-line.done{background:linear-gradient(90deg,var(--xp1),var(--xp2));}
.qp-reward{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;border:2px solid rgba(46,42,58,.16);background:#fafbfa;transition:.3s;z-index:1;}
.qpath.locked .qp-reward{opacity:.45;font-size:14px;}
.qpath.ready .qp-reward{background:linear-gradient(135deg,#fff3d6,#ffd98a);border-color:rgba(245,166,35,.5);box-shadow:0 0 14px rgba(245,166,35,.5);animation:bonusPulse 1.8s ease-in-out infinite;}
.qpath.claimed .qp-reward{background:linear-gradient(135deg,rgba(31,200,169,.2),rgba(46,204,143,.15));border-color:rgba(31,200,169,.4);}
.qp-info{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.qp-text{font-size:11px;color:var(--muted);line-height:1.4;}
.qpath.ready .qp-text{color:#b9791a;font-weight:700;}
.qpath.claimed .qp-text{color:#1e9b86;font-weight:700;}
.qp-rw-info{font-size:10px;color:var(--muted);}
.qp-claim{border:none;border-radius:9px;padding:6px 14px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;transition:.15s;}
.qpath.ready .qp-claim{background:linear-gradient(135deg,var(--coin),#ffd98a);color:#fff;box-shadow:0 3px 10px rgba(245,166,35,.4);}
.qpath.ready .qp-claim:active{transform:scale(.94);}
.qp-edit{font-size:9px;color:var(--muted);cursor:pointer;text-decoration:underline;}
/* 任务状态筛选 */
.task-filter{display:flex;gap:4px;margin:6px 0;}
.task-filter button{border:none;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(46,42,58,.06);color:var(--muted);transition:.2s;}
.task-filter button.on{background:rgba(31,200,169,.18);color:#1e9b86;box-shadow:0 1px 4px rgba(31,200,169,.15);}

/* 任务卡牌 */
.quest{position:relative;border-radius:16px;padding:12px 12px 12px 16px;margin-bottom:11px;
  background:var(--glass);border:1px solid var(--line);box-shadow:0 4px 14px rgba(46,42,58,.06);overflow:hidden;cursor:pointer;transition:transform .12s;}
.quest::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--card-color);box-shadow:0 0 10px var(--card-color);}
.quest .glow{position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,var(--attr),transparent 70%);opacity:.14;}
.quest .qrow{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1;}
.qname{font-size:14px;font-weight:700;}
.qmeta{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;}
.qmeta-tags{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(46,42,58,.06);color:var(--muted);}
.chip.attr{color:#fff;background:var(--card-color);font-weight:600;}
.qreward{display:flex;flex-direction:row;align-items:center;gap:12px;font-size:11px;flex:0 0 auto;white-space:nowrap;position:relative;z-index:1;align-self:flex-end;margin-top:5px;}
.qreward .xp{color:var(--xp1);font-weight:800;}
.qreward .gc{color:var(--coin);font-weight:800;}
.attack{margin-top:10px;width:100%;border:none;border-radius:11px;padding:11px;font-size:14px;font-weight:800;
  letter-spacing:1px;color:#fff;background:linear-gradient(135deg,var(--card-color),#ffffff66);
  box-shadow:0 4px 12px rgba(46,42,58,.12);cursor:pointer;position:relative;z-index:1;transition:transform .1s;}
.attack:active{transform:scale(.96);}
.quest.done{opacity:.6;}
.quest.done .attack{background:rgba(46,42,58,.1);color:var(--muted);box-shadow:none;}
.quest .qdel{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:7px;border:none;background:rgba(46,42,58,.06);color:var(--muted);font-size:13px;line-height:1;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;transition:.15s;}
.quest .qdel:hover{background:rgba(255,107,129,.16);color:#ff6b81;}
/* 任务卡色系：每卡独立颜色，通过 --card-color 变量控制左竖条+按钮，--card-bg* 控制底色 */
.quest.quest-today,.quest.quest-long{
  background:linear-gradient(135deg,var(--card-bg1),var(--card-bg2));
  border-color:var(--card-border);
  box-shadow:0 4px 14px var(--card-shadow);
}
.quest.quest-today .glow,.quest.quest-long .glow{
  background:radial-gradient(circle,var(--card-color),transparent 70%);opacity:.16;
}
.quest.quest-today.done .attack,.quest.quest-long.done .attack{
  background:rgba(46,42,58,.1);color:var(--muted);box-shadow:none;
}

/* 任务库行 */
.lib{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:13px;
  background:var(--glass);border:1px solid var(--line);margin-bottom:8px;box-shadow:0 2px 8px rgba(46,42,58,.04);}
.lib .lm{font-size:13px;font-weight:600;}
.lib .ls{font-size:10px;color:var(--muted);margin-top:3px;}
.lib .del{font-size:16px;color:#c9a;background:none;border:none;cursor:pointer;padding:4px;}

/* 新建表单 */
.field{margin:9px 0;}
.field label{font-size:11px;color:#1e9b86;letter-spacing:.5px;display:block;margin-bottom:5px;font-weight:700;}
.field input,.field select{width:100%;padding:10px 12px;border-radius:11px;font-size:13px;
  background:#fafbfa;border:1px solid var(--line);color:var(--text);}
.field input:focus,.field select:focus{outline:none;border-color:var(--xp1);box-shadow:0 0 0 2px rgba(31,200,169,.2);}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:9px;border-radius:11px;font-size:12px;font-weight:700;cursor:pointer;
  background:#fafbfa;border:1px solid var(--line);color:var(--muted);}
.seg button.on{background:linear-gradient(135deg,var(--xp1),var(--xp2));color:#fff;border:none;box-shadow:0 4px 12px rgba(31,200,169,.3);}
.attsel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.attsel button{padding:8px 4px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;
  background:#fafbfa;border:1px solid var(--line);color:var(--muted);text-align:center;}
.attsel button.on{color:#fff;font-weight:800;}
.attr-hint{margin-top:6px;padding:7px 10px;border-radius:9px;font-size:10px;line-height:1.5;
  background:#f7f8f7;border-left:3px solid var(--line);color:#6b6478;transition:all .2s;}
.attr-hint .ah-ico{font-weight:800;margin-right:4px;}
.reco{display:flex;align-items:center;gap:8px;margin-top:8px;padding:9px 12px;border-radius:11px;
  background:linear-gradient(135deg,rgba(31,200,169,.12),rgba(255,184,0,.1));border:1px dashed rgba(31,200,169,.4);}
.reco .rt{font-size:11px;color:#1e9b86;font-weight:700;}
.reco .rv{font-size:13px;font-weight:800;color:#2e2a3a;}
/* 表单分组卡片 */
.form-group{border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fafbfa;border:1px solid var(--line);}
.form-group .fg-title{font-size:11px;font-weight:800;color:#8a8398;letter-spacing:.8px;margin-bottom:9px;display:flex;align-items:center;gap:5px;}
.form-group .fg-title .fg-num{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#1fc8a9,#ffb800);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.big-btn{width:100%;margin-top:12px;border:none;border-radius:13px;padding:13px;font-size:14px;font-weight:800;
  letter-spacing:1px;color:#fff;background:linear-gradient(135deg,#1fc8a9,#ffb800);
  box-shadow:0 6px 16px rgba(31,200,169,.35);cursor:pointer;}
.ghost-btn{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:13px;padding:11px;font-size:13px;font-weight:700;
  color:var(--muted);background:#fafbfa;cursor:pointer;}

/* 角色屏 */
.hero-stage{position:relative;border-radius:20px;padding:14px 16px 8px;margin-bottom:13px;text-align:center;
  background:radial-gradient(circle at 50% 30%,#fff5e8 0%,#ffe9d6 60%,#fafaff 100%);border:1px solid var(--line);overflow:hidden;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;}
.hero-stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(1px 1px,rgba(255,210,160,.5),transparent);background-size:22px 22px;opacity:.5;}
.hero-figure{position:relative;display:inline-block;z-index:1;line-height:0;}
.hero-img{width:130px;height:auto;display:block;position:relative;z-index:2;filter:drop-shadow(0 4px 8px rgba(46,42,58,.12));}
.aura-badge{position:absolute;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  background:#fff;border-width:2.5px;border-style:solid;z-index:3;
  animation:auraFloat 2.8s ease-in-out infinite;}
.aura-badge::after{content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid var(--ac);opacity:.3;animation:auraPulse 2s ease-in-out infinite;}
@keyframes auraFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes auraPulse{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.15);opacity:.1}}
.hero-name{font-size:16px;font-weight:800;margin-top:4px;}
.hero-sub{font-size:11px;color:#7b6fb0;margin-top:2px;}
.hero-next{font-size:11px;color:#1e9b86;font-weight:700;margin-top:5px;}
/* 已解锁成就勋章行 */
.ach-badges{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap;}
.ach-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;
  background:linear-gradient(135deg,#ffb800,#ffd98a);box-shadow:0 2px 10px rgba(245,166,35,.35);
  border:2px solid rgba(255,255,255,.7);cursor:default;transition:transform .15s;position:relative;}
.ach-badge:hover{transform:scale(1.18);}
.ach-badge::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid rgba(245,166,35,.3);animation:auraPulse 2.5s ease-in-out infinite;}
.ach-badges-empty{font-size:10px;color:#c4b498;margin-top:7px;letter-spacing:.5px;}
/* 勋章点击信息卡 */
.ach-cap{margin-top:8px;padding:6px 12px;border-radius:9px;background:rgba(255,184,0,.1);border:1px solid rgba(245,166,35,.25);font-size:12px;color:#b9791a;text-align:center;display:none;}
.ach-cap.show{display:inline-block;animation:pop .3s ease;}
.ach-cap .ach-num{color:#e8951a;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;}
.ach-badge{cursor:pointer !important;}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
.ring{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:10px 4px 8px;text-align:center;box-shadow:0 3px 10px rgba(46,42,58,.05);transition:transform .15s;}
.ring svg{display:block;margin:0 auto;}
.ring.highlight{animation:ringHighlight .9s ease-out;}
@keyframes ringHighlight{
  0%{transform:scale(1);}
  20%{transform:scale(1.28);filter:drop-shadow(0 0 14px var(--ac));border-color:var(--ac);}
  60%{transform:scale(1.12);filter:drop-shadow(0 0 7px var(--ac));}
  100%{transform:scale(1);filter:none;}
}
/* 等级称号阶段图（长条阶段，不用饼图：等级是单一线性进度，饼图会误导成"部分之和"） */
.stagebar{display:flex;gap:4px;margin:10px 0 4px;}
.stagebar .seg{flex:1;min-width:0;border-radius:12px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:rgba(46,42,58,.05);border:1px solid var(--line);transition:.2s;cursor:pointer;}
.stagebar .seg:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(46,42,58,.1);}
.stagebar .seg.selected{border-color:#1fc8a9;box-shadow:0 0 0 2px rgba(31,200,169,.25);}
.stagebar .seg .si{font-size:17px;line-height:1;}
.stagebar .seg .sl{font-size:9px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.stagebar .seg.past{background:linear-gradient(135deg,rgba(31,200,169,.16),rgba(255,184,0,.12));}
.stagebar .seg.past .sl{color:#1e9b86;}
.stagebar .seg.cur{background:linear-gradient(135deg,var(--xp1),var(--xp2));border:none;box-shadow:0 5px 14px rgba(31,200,169,.35);transform:translateY(-4px);}
.stagebar .seg.cur .sl{color:#fff;}
.stagebar .seg.cur .si{filter:drop-shadow(0 0 4px rgba(255,255,255,.7));}
.stage-cap{font-size:11px;color:#5a8a7e;margin-top:8px;line-height:1.6;background:rgba(31,200,169,.07);border:1px solid rgba(31,200,169,.18);border-radius:11px;padding:8px 11px;}
.stage-cap b{color:#1e9b86;}
.stage-cap .nx{color:#b9791a;font-weight:700;}

/* 统计卡 */
.stat-card{border-radius:16px;padding:14px;margin-bottom:11px;background:var(--glass);border:1px solid var(--line);box-shadow:0 3px 10px rgba(46,42,58,.05);}
.stat-card .lab{font-size:11px;color:var(--muted);letter-spacing:.5px;}
.stat-card .big{font-size:26px;font-weight:800;margin-top:4px;
  background:linear-gradient(135deg,var(--xp1),var(--coin));-webkit-background-clip:text;background-clip:text;color:transparent;}
.mini-rings{display:flex;gap:6px;flex-wrap:wrap;}

/* 成就墙 */
.ach{position:relative;border-radius:16px;padding:13px;margin-bottom:11px;background:var(--glass);border:1px solid var(--line);box-shadow:0 3px 10px rgba(46,42,58,.05);overflow:hidden;}
.ach.unlocked{border-color:rgba(245,166,35,.5);background:linear-gradient(135deg,rgba(255,184,0,.1),#fff);}
.ach .arow{display:flex;align-items:center;gap:10px;}
.ach .aico{font-size:24px;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(46,42,58,.06);flex:0 0 auto;}
.ach.unlocked .aico{background:linear-gradient(135deg,#ffb800,#ffd98a);box-shadow:0 0 12px rgba(245,166,35,.4);}
.ach .an{font-size:14px;font-weight:800;}
.ach .ad{font-size:11px;color:var(--muted);margin-top:2px;}
.ach .aprog{height:9px;border-radius:6px;margin-top:10px;background:rgba(46,42,58,.08);overflow:hidden;}
.ach .afill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--xp1),var(--xp2));transition:width .6s;}
.ach .atxt{font-size:11px;color:#1e9b86;font-weight:700;margin-top:5px;}
.ach.unlocked .atxt{color:#b9791a;}

/* 愿望 */
.loot{border-radius:18px;padding:13px 14px;margin-bottom:13px;background:linear-gradient(135deg,#fff3d6,#ffe2c2);border:1px solid rgba(245,166,35,.3);box-shadow:0 4px 14px rgba(245,166,35,.15);}
.loot .lh{font-size:12px;font-weight:800;color:#b9791a;letter-spacing:.5px;}
.loot .lb{font-size:14px;font-weight:800;margin-top:5px;color:#7a4f12;line-height:1.5;}
.loot .lm{font-size:11px;color:#a87b35;margin-top:4px;}
.chest{border-radius:16px;padding:12px;margin-bottom:11px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(46,42,58,.05);}
.chest .ico{font-size:26px;filter:drop-shadow(0 0 6px rgba(245,166,35,.4));flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.chest .ico img{width:30px;height:30px;border-radius:8px;object-fit:cover;filter:drop-shadow(0 0 4px rgba(245,166,35,.3));}
.chest .cinfo{flex:1;}
.chest .cname{font-size:14px;font-weight:700;}
.chest .cmeta{font-size:11px;color:var(--muted);margin-top:3px;}
.chest .cfav{display:inline-block;font-size:10px;font-weight:700;color:#b9791a;background:#fff0d4;padding:1px 7px;border-radius:999px;margin-left:6px;}
.empty-tip{text-align:center;padding:24px 16px;font-size:12px;color:var(--muted);background:rgba(46,42,58,.04);border-radius:14px;border:1px dashed rgba(46,42,58,.12);margin-bottom:13px;}
/* 今日副本里的休息状态徽章（纯展示，不可点击） */
.rest-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:10px 0 8px;border-radius:14px;background:linear-gradient(135deg,#e6f4ff,#d4e8ff);border:1px solid rgba(116,170,255,.35);box-shadow:0 3px 10px rgba(116,170,255,.12);position:relative;overflow:hidden;}
.rest-banner::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#74aaff,#4d9bff);}
.rest-banner .rb-ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#74aaff,#4d9bff);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;box-shadow:0 3px 8px rgba(77,155,255,.3);}
.rest-banner .rb-body{flex:1;min-width:0;}
.rest-banner .rb-title{font-size:13px;font-weight:800;color:#2e5a8a;letter-spacing:.3px;}
.rest-banner .rb-desc{font-size:11px;color:#5a7398;margin-top:2px;line-height:1.4;}

/* 安装引导横幅（PWA 安装提示） */
.install-banner{display:flex;align-items:center;gap:11px;padding:11px 13px;margin:10px 0 8px;border-radius:14px;background:linear-gradient(135deg,#fff5e0,#ffe9b8);border:1px solid rgba(255,184,0,.4);box-shadow:0 3px 10px rgba(255,184,0,.12);position:relative;overflow:hidden;}
.install-banner::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#ffb800,#ff8800);}
.install-banner .ib-ico{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#ffb800,#ff8800);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;box-shadow:0 3px 8px rgba(255,136,0,.3);color:#fff;font-weight:800;}
.install-banner .ib-body{flex:1;min-width:0;}
.install-banner .ib-title{font-size:13px;font-weight:800;color:#8a5a0e;letter-spacing:.3px;}
.install-banner .ib-desc{font-size:11px;color:#a87a2e;margin-top:2px;line-height:1.45;}
.install-banner .ib-close{background:none;border:none;font-size:18px;color:#b9791a;cursor:pointer;padding:2px 6px;line-height:1;flex:0 0 auto;opacity:.6;}
.install-banner .ib-close:hover{opacity:1;}
.install-banner .ib-btn{margin-top:6px;display:inline-block;padding:6px 12px;border-radius:8px;background:linear-gradient(135deg,#ffb800,#ff8800);color:#fff;font-size:11px;font-weight:700;cursor:pointer;border:none;box-shadow:0 2px 6px rgba(255,136,0,.3);}
.install-banner .ib-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(255,136,0,.4);}
.install-banner.dismissed{display:none;}

/* 道具卡：「今天我休息」 */
.rest-card{border-radius:18px;padding:14px;margin-bottom:13px;background:linear-gradient(135deg,#e6f4ff,#d8ecff);border:1px solid rgba(116,170,255,.35);box-shadow:0 4px 14px rgba(116,170,255,.18);display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;}
.rest-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#74aaff,#4d9bff);}
.rest-card .r-ico{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#74aaff,#4d9bff);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;box-shadow:0 4px 12px rgba(77,155,255,.35);position:relative;}
.rest-card .r-ico .r-count{position:absolute;top:-6px;right:-6px;background:#ff6b81;color:#fff;font-size:10px;font-weight:800;min-width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 6px rgba(255,107,129,.4);}
.rest-card .r-info{flex:1;min-width:0;}
.rest-card .r-name{font-size:14px;font-weight:800;color:#2e5a8a;letter-spacing:.3px;}
.rest-card .r-desc{font-size:11px;color:#5a7398;margin-top:3px;line-height:1.5;}
.rest-card .r-use{flex:0 0 auto;padding:7px 14px;border-radius:12px;background:linear-gradient(135deg,#74aaff,#4d9bff);color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;box-shadow:0 3px 8px rgba(77,155,255,.35);transition:transform .15s;white-space:nowrap;}
.rest-card .r-use:hover{transform:translateY(-1px);}
.rest-card .r-use:disabled{background:#b8c5d6;box-shadow:none;cursor:not-allowed;transform:none;}
.rest-card .r-tips{position:absolute;right:10px;bottom:6px;font-size:9px;color:#5a7398;opacity:.7;}
.rest-history{border-radius:14px;padding:10px 12px;background:rgba(232,240,252,.6);border:1px solid rgba(116,170,255,.2);margin-top:-4px;margin-bottom:13px;}
.rest-history .rh-title{font-size:10px;font-weight:700;color:#5a7398;letter-spacing:.5px;margin-bottom:5px;}
.rest-history .rh-row{font-size:11px;color:#5a7398;padding:2px 0;display:flex;align-items:center;gap:6px;}
.rest-history .rh-row .rh-ico{font-size:12px;opacity:.7;}
.rest-history .rh-empty{font-size:11px;color:#8a9bb5;font-style:italic;padding:3px 0;}
/* 「今天我休息」确认弹窗 */
.rest-modal{position:absolute;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.rest-modal .rm-mask{position:absolute;inset:0;background:rgba(46,42,58,.4);pointer-events:auto;animation:rmFadeIn .2s ease;}
.rest-modal .rm-box{position:relative;width:300px;background:#fff;border-radius:20px;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(46,42,58,.25);pointer-events:auto;animation:rmPop .25s cubic-bezier(.34,1.56,.64,1);}
.rest-modal .rm-ico{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#74aaff,#4d9bff);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;box-shadow:0 8px 20px rgba(77,155,255,.4);}
.rest-modal .rm-title{font-size:17px;font-weight:800;text-align:center;color:#2e5a8a;margin-bottom:10px;letter-spacing:.5px;}
.rest-modal .rm-desc{font-size:12px;line-height:1.7;color:#5a7398;background:#f0f6ff;padding:12px 14px;border-radius:12px;margin-bottom:16px;}
.rest-modal .rm-desc b{color:#2e5a8a;}
.rest-modal .rm-tip{display:block;margin-top:8px;text-align:center;font-size:11px;color:#4d9bff;font-style:italic;}
.rest-modal .rm-btns{display:flex;gap:10px;}
.rest-modal .rm-btns button{flex:1;padding:11px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:transform .15s;}
.rest-modal .rm-btns button:active{transform:scale(.96);}
.rest-modal .rm-cancel{background:#f0f3f8;color:#5a7398;}
.rest-modal .rm-ok{background:linear-gradient(135deg,#74aaff,#4d9bff);color:#fff;box-shadow:0 4px 12px rgba(77,155,255,.35);}
@keyframes rmFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes rmPop{from{opacity:0;transform:scale(.85) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.redeem{border:none;border-radius:11px;padding:8px 14px;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--coin),#ffd98a);cursor:pointer;white-space:nowrap;box-shadow:0 4px 12px rgba(245,166,35,.3);}
.redeem:disabled{background:rgba(46,42,58,.12);color:var(--muted);cursor:not-allowed;box-shadow:none;}
/* 标识选择器 */
.icosrc{margin-bottom:8px;}
.icosrc .src-tab{display:flex;gap:6px;margin-bottom:8px;}
.icosrc .src-tab button{flex:1;padding:7px;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;background:#fafbfa;border:1px solid var(--line);color:var(--muted);}
.icosrc .src-tab button.on{background:linear-gradient(135deg,var(--xp1),var(--xp2));color:#fff;border:none;box-shadow:0 3px 10px rgba(31,200,169,.3);}
.icogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;}
.icogrid button{font-size:18px;border:1px solid var(--line);border-radius:8px;background:#fafbfa;padding:5px 0;cursor:pointer;transition:.12s;}
.icogrid button:hover{background:rgba(31,200,169,.1);}
.icogrid button.on{border-color:var(--xp1);background:rgba(31,200,169,.18);box-shadow:0 0 0 2px rgba(31,200,169,.2);}
.ico-preview .pv{font-size:22px;}
.ico-preview .pv img{width:24px;height:24px;border-radius:6px;object-fit:cover;}
.ico-upload{display:none;}
.upload-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;background:#fafbfa;border:1px dashed var(--line);color:var(--muted);transition:.15s;}
.upload-btn:hover{border-color:var(--xp1);color:#1e9b86;background:rgba(31,200,169,.06);}

/* tabbar：3 个，今日居中放大 */
.tabbar{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 0 8px;}
.tab{flex:1;text-align:center;padding:5px 0;font-size:10px;color:var(--muted);cursor:pointer;position:relative;}
.tab .ti{font-size:18px;display:block;margin-bottom:2px;filter:grayscale(.5);opacity:.7;transition:.2s;}
.tab.active{color:#1e9b86;font-weight:700;}
.tab.active .ti{filter:none;opacity:1;}
.tab.center .ti{font-size:26px;}
.tab.center.active .ti{transform:translateY(-3px) scale(1.15);filter:drop-shadow(0 0 8px rgba(31,200,169,.7));}
.tab.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--xp1),var(--xp2));}
.tabbar.hidden{display:none;}

/* 特效 */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:50;}
.float{position:absolute;font-weight:800;font-size:15px;white-space:nowrap;animation:floatUp 1.1s ease-out forwards;text-shadow:0 0 5px #fff,0 1px 2px rgba(0,0,0,.2);}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.7)}20%{opacity:1;transform:translateY(-12px) scale(1.1)}100%{opacity:0;transform:translateY(-60px) scale(1)}}
.coinpop{position:absolute;font-size:18px;animation:coinDrop 1s ease-in forwards;}
@keyframes coinDrop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(54px) rotate(40deg)}}
.levelup{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.82);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s;}
.levelup.show{opacity:1;}
.levelup .lu{font-size:34px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--coin),var(--xp1));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .6s cubic-bezier(.2,1.4,.4,1);text-align:center;}
.levelup .sub{margin-top:6px;font-size:14px;color:#1e9b86;animation:pop .6s .15s both;font-weight:700;}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.spark{position:absolute;font-size:22px;animation:spark 1s ease-out forwards;}
@keyframes spark{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.4) translateY(-20px)}}
.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;}

/* ===== v40.4 日历视图 ===== */
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px;}
.cal-title{font-size:17px;font-weight:800;color:var(--text);}
.cal-nav{display:flex;gap:6px;}
.cal-nav button{width:30px;height:30px;border-radius:50%;background:rgba(31,200,169,.1);color:var(--xp1);font-size:14px;font-weight:800;border:none;cursor:pointer;transition:.2s;}
.cal-nav button:hover{background:var(--xp1);color:#fff;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.cal-weekdays div{text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.5);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;position:relative;cursor:pointer;transition:.2s;color:var(--text);}
.cal-cell.empty{visibility:hidden;}
.cal-cell.today{border:2px solid var(--xp1);background:rgba(31,200,169,.1);}
.cal-cell.future{color:var(--muted);opacity:.6;}
.cal-cell .cal-done{position:absolute;bottom:3px;display:flex;gap:1px;}
.cal-cell .cal-done span{width:4px;height:4px;border-radius:50%;background:var(--xp1);}
.cal-cell.full .cal-done span{background:var(--xp2);}
.cal-cell:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(31,200,169,.2);}
.cal-cell.selected{background:linear-gradient(135deg,var(--xp1),var(--xp2));color:#fff;box-shadow:0 6px 18px rgba(31,200,169,.4);}
.cal-legend{display:flex;justify-content:center;gap:14px;margin-top:10px;font-size:10px;color:var(--muted);}
.cal-legend span{display:inline-flex;align-items:center;gap:4px;}
.cal-legend .dot{width:8px;height:8px;border-radius:50%;}
.cal-detail{margin-top:14px;padding:12px;background:rgba(255,255,255,.7);border-radius:14px;border:1px solid var(--line);}
.cal-detail .cd-date{font-size:13px;font-weight:800;color:var(--xp1);margin-bottom:8px;}
.cal-detail .cd-task{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12px;margin-bottom:4px;background:rgba(31,200,169,.05);}

<script>
/* ========== 存档（LocalStorage 持久化层） ==========
 * 设计原则：
 * 1. 启动时尝试 loadState()，有存档则恢复，无则用下方默认 demo 数据
 * 2. 每个修改 state 的函数末尾调用 saveState() 自动落盘
 * 3. 临时 UI 状态（formOpen / sel / icoSel / bonusEditing）不存
 * 4. 存档版本号便于未来 schema 升级时做迁移
 */
const STORAGE_KEY = 'habit-ascend-v1';
const STORAGE_VERSION = 1;
let _saving = false;  // 防重入
function saveState(){
  if(_saving) return;
  _saving = true;
  try{
    const data = {
      v: STORAGE_VERSION,
      level: state.level, xp: state.xp, xpmax: state.xpmax,
      coins: state.coins, happiness: state.happiness, streak: state.streak,
      restCards: state.restCards, restUsed: state.restUsed, restUsedThisWeek: state.restUsedThisWeek,
      tasks: state.tasks, wishes: state.wishes,
      dailyBonus: state.dailyBonus, taskFilter: state.taskFilter,
      _lastCheckDay: state._lastCheckDay,
      // v40.4 新增:每日完成记录(键为 YYYY-MM-DD)
      completions: state.completions || {},
      // 6 维属性值（修复老 bug:之前直接改 ATTRS 全局常量,刷新就丢）
      attrs: Object.fromEntries(Object.entries(ATTRS).map(([k,v])=>[k, v.val])),
      wishFilter: wishFilter, achFilter: achFilter,
      _savedAt: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    console.warn('[存档] 保存失败', e);
  }finally{
    _saving = false;
  }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || s.v !== STORAGE_VERSION){
      console.warn('[存档] 版本不匹配，使用默认数据');
      return false;
    }
    // 字段级合并：保留 state 原结构，未在新存档里的字段保留 demo 默认值
    Object.assign(state, {
      level: s.level, xp: s.xp, xpmax: s.xpmax,
      coins: s.coins, happiness: s.happiness, streak: s.streak,
      restCards: s.restCards ?? 0, restUsed: s.restUsed ?? [],
      restUsedThisWeek: s.restUsedThisWeek ?? 0,
      tasks: Array.isArray(s.tasks) ? s.tasks : state.tasks,
      wishes: Array.isArray(s.wishes) ? s.wishes : state.wishes,
      dailyBonus: s.dailyBonus ?? state.dailyBonus,
      taskFilter: s.taskFilter ?? '全部',
      _lastCheckDay: s._lastCheckDay,
      // v40.4 新增:每日完成记录
      completions: s.completions || {}
    });
    // 恢复属性值(老存档可能没 attrs 字段)
    if(s.attrs && typeof s.attrs === 'object'){
      Object.keys(ATTRS).forEach(k=>{
        if(typeof s.attrs[k] === 'number') ATTRS[k].val = s.attrs[k];
      });
    }
    // 派生字段重算
    state.xpmax = levelReq(state.level);
    state.title = titleFor(state.level);
    // 全局筛选状态
    if(s.wishFilter) wishFilter = s.wishFilter;
    if(s.achFilter) achFilter = s.achFilter;
    console.log('[存档] 已恢复，数据时间：', new Date(s._savedAt).toLocaleString('zh-CN'));
    return true;
  }catch(e){
    console.warn('[存档] 读取失败', e);
    return false;
  }
}
function resetState(){
  if(!confirm('确定要清空所有数据吗？\n（任务、愿望、属性、休息卡全部归零）')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// 全新开始(直接写空状态,不等 reload)
function startFresh(){
  if(!confirm('确定要清空所有数据并重新开始吗?')) return;
  localStorage.removeItem(STORAGE_KEY);
  // 直接覆写 state 为空存档
  state.level=1; state.xp=0; state.xpmax=levelReq(1);
  state.coins=0; state.happiness=0; state.streak=0;
  state.restCards=0; state.restUsed=[]; state.restUsedThisWeek=0;
  state.tasks=[]; state.wishes=[];
  state.dailyBonus={name:'',ico:'',coin:0,exp:0,claimed:false};
  state.completions={};  // v40.4:清空每日完成记录
  // 6 维属性值也归零
  Object.keys(ATTRS).forEach(k=>ATTRS[k].val=0);
  saveState();
  renderToday();
  alert('已清空,开始新旅程 🌱');
}

const ATTRS = {
  '体魄':{color:'#ff6b81', val:0, icon:'💪', desc:'运动锻炼 · 早睡早起 · 喝水作息 · 一切让身体更好的事'},
  '技能':{color:'#4d9bff', val:0, icon:'🎓', desc:'读书学习 · 编程外语 · 专业考证 · 一切可习得的硬技能'},
  '创造':{color:'#9b6dff', val:0, icon:'🎨', desc:'写作绘画 · 编曲设计 · 拍视频 · 一切输出型创造'},
  '生活':{color:'#2ecc8f', val:0, icon:'🏠', desc:'家务整理 · 烹饪修理 · 把生活打理好的手艺'},
  '社交':{color:'#ff8c42', val:0, icon:'💬', desc:'联系朋友 · 陪伴家人 · 参加活动 · 关系维护'},
  '魅力':{color:'#e056a0', val:0, icon:'✨', desc:'护肤保养 · 塑形健身 · 穿搭打扮 · 一切让自己状态更好的事'},
};
// 等级称号阶梯（科学梯度：每5级一段，难度递增）
const TIERS=[
  {min:1, max:4,  icon:'🌱', name:'萌新旅人'},
  {min:5, max:9,  icon:'🚶', name:'起步者'},
  {min:10,max:14, icon:'⚔',  name:'行动派'},
  {min:15,max:19, icon:'🔥', name:'自律者'},
  {min:20,max:29, icon:'🛡', name:'进阶骑士'},
  {min:30,max:39, icon:'👑', name:'掌控者'},
  {min:40,max:49, icon:'🌟', name:'大师'},
  {min:50,max:999,icon:'🐉', name:'传奇勇者'},
];
const tierFor = lv => TIERS.find(t=>lv>=t.min && lv<=t.max);
const titleFor = lv => tierFor(lv).name;
const nextTier = lv => TIERS.find(t=>lv < t.min);
// 等级经验曲线：100 * lv^0.65，取整至5的倍数
// 设计依据：累计到Lv5≈720EXP(~21天)，Lv10≈2635EXP(~66天)，与Lally习惯形成研究吻合
const levelReq = lv => Math.round(100 * Math.pow(lv, 0.65) / 5) * 5;
// 难度奖励 [EXP, 金币]：金币产出降低以平衡愿望经济（2-3天攒够一个小愿望）
const DIFF = {易:[5,2], 中:[10,5], 难:[20,12]};
// 属性加点：易+1 / 中+2 / 难+4，使21天易打卡=21(萌芽)，21天中打卡=42(扎根)，66天易打卡=66(自动化)
const ATTR_GAIN = {易:1, 中:2, 难:4};
// 频率下拉选项：长期=习惯周期，临时=截止周期
const FREQS = {
  '长期':['每日','每周3次','每周5次','工作日','周末'],
  '临时':['今天截止','本周内','本月内'],
};
// v40.4:休息卡作为系统道具,可从愿望宝箱兑换
// 科学定价:参考 21/42/66 天连击各送 1 张,平均产出节奏 ~50-66 天/张
// 一个休息卡相当于"省一天打卡"(约 +30 金币产出),所以 80-100 金币合理
const REST_CARD_PRICE = 80;
// 难度×类型 → 固定科学奖励：临时任务 +50% bonus（即时性强化：Fogg模型中Prompt越近Reward越强）
function rewardFor(diff, type){
  let [x,c]=DIFF[diff];
  if(type==='临时'){x=Math.round(x*1.5); c=Math.round(c*1.5);}
  return {xp:x, coin:c};
}
// 连击奖励（变比强化 Skinner）：在特定天数给惊喜奖励，不可预测→多巴胺最强烈
// 不提前告知用户何时触发，让每次打卡都有"也许今天有惊喜"的期待
const STREAK_BONUSES=[
  {days:3,  xp:0,   coins:5,   label:'3天连击！'},
  {days:7,  xp:15,  coins:10,  label:'7天连击！一周坚持'},
  {days:14, xp:30,  coins:20,  label:'14天连击！'},
  {days:21, xp:50,  coins:50,  label:'21天达成！习惯萌芽'},
  {days:30, xp:80,  coins:60,  label:'30天连击！抗拒期已过'},
  {days:42, xp:100, coins:80,  label:'42天达成！习惯扎根'},
  {days:66, xp:150, coins:100, label:'66天达成！习惯自动化'},
  {days:100,xp:200, coins:150, label:'100天连击！百日成就'},
];
// 属性里程碑：对应Lally研究的自动化曲线关键节点
const ATTR_MILESTONES=[
  {val:21,  label:'习惯萌芽',  desc:'21天里程碑 — 习惯开始萌芽',color:'#1D9E75'},
  {val:42,  label:'习惯扎根',  desc:'42天里程碑 — 习惯已经扎根',color:'#BA7517'},
  {val:66,  label:'习惯自动化',desc:'66天里程碑 — 行为趋于自动化',color:'#185FA5'},
  {val:100, label:'领域大师',  desc:'100满值 — 你已掌握这个领域',color:'#D4537E'},
];
// 任务卡调色板：今日任务=暖色系，长期任务=冷色系，每张卡在组内按索引取色
const TODAY_COLORS=['#ff5e62','#ff8c42','#ffa94d','#ffc93c','#ff6b81','#ff7e5f'];
const LONG_COLORS=['#4d9bff','#9b6dff','#06b6d4','#6366f1','#7c3aed','#0284c7'];
function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

let state = {
  level:3, xp:130, xpmax:levelReq(3), coins:55, happiness:0, streak:12,
  restCards:2,                // "今天我休息"卡持有量
  restUsed:[],                // 使用记录 [{date:'08-05',label:'好好休息'}]
  restUsedThisWeek:0,         // 本周已使用次数（每周限1张，防止滥用）
  tasks:[
    {id:1,name:'晨跑 3 公里',type:'长期',attr:'体魄',freq:'每日',diff:'中',xp:10,coin:5,done:false},
    {id:2,name:'读 30 分钟书',type:'长期',attr:'技能',freq:'每日',diff:'中',xp:10,coin:5,done:false},
    {id:3,name:'写 200 字日记',type:'长期',attr:'创造',freq:'每日',diff:'易',xp:5,coin:2,done:false},
    {id:4,name:'整理书桌',type:'临时',attr:'生活',freq:'今天截止',diff:'中',xp:15,coin:8,done:false},
    {id:5,name:'给老妈打电话',type:'临时',attr:'社交',freq:'本周内',diff:'难',xp:30,coin:18,done:false},
    {id:6,name:'晚间护肤流程',type:'长期',attr:'魅力',freq:'每日',diff:'易',xp:5,coin:2,done:false},
  ],
  wishes:[
    {id:1,name:'一杯奶茶',cost:50,ico:'🧋',count:9,monthCount:3},
    {id:2,name:'看一集剧',cost:30,ico:'📺',count:4,monthCount:1},
    {id:3,name:'买本新书',cost:120,ico:'📖',count:1,monthCount:0},
  ],
  dailyBonus:{name:'看一部电影',ico:'🎬',coin:15,exp:15,claimed:false},
  taskFilter:'全部'
};
let formOpen=false;
let sel={type:'长期',attr:'体魄',diff:'中',freq:FREQS['长期'][0]};
let wishFilter='全部';      // 愿望宝箱筛选：'全部' | '可兑换' | '不可兑换'
let achFilter='全部';       // 成就墙筛选：'全部' | '已达成' | '未达成'
let bonusEditing=false;     // 今日奖励编辑表单开关

// 启动时尝试加载存档
loadState();
// v40.4 老存档迁移:把旧的 t.done 转成每日 completions
migrateDoneField();

// 如果是 Capacitor 原生 App 且无存档:跳过 demo,空状态启动(自用版不留示例数据)
const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if(IS_NATIVE && !localStorage.getItem(STORAGE_KEY)){
  state.level=1; state.xp=0; state.xpmax=levelReq(1);
  state.coins=0; state.happiness=0; state.streak=0;
  state.restCards=0; state.restUsed=[]; state.restUsedThisWeek=0;
  state.tasks=[]; state.wishes=[];
  state.dailyBonus={name:'',ico:'',coin:0,exp:0,claimed:false};
  state.completions={};  // v40.4
  Object.keys(ATTRS).forEach(k=>ATTRS[k].val=0);  // 属性值也归零
  saveState();
  console.log('[Init] Capacitor 原生首次启动,使用空状态');
}
// 今日通关奖励推荐预设
const BONUS_PRESETS=[
  {ico:'🎬',name:'看一部电影',coin:15,exp:15},
  {ico:'🎮',name:'玩 1 小时游戏',coin:12,exp:10},
  {ico:'🧋',name:'喝一杯奶茶',coin:20,exp:15},
  {ico:'🍕',name:'吃顿好的',coin:25,exp:20},
  {ico:'💆',name:'放松 30 分钟',coin:12,exp:10},
  {ico:'📺',name:'刷 2 集剧',coin:12,exp:10},
  {ico:'🛍️',name:'挑个小东西',coin:15,exp:15},
  {ico:'😴',name:'今天早点睡',coin:8,exp:10},
];

// ========== 日期感知（v40.4 重构） ==========
// 历史问题:t.done 是任务级永久标志,导致昨天打卡的任务今天还在「已完成」里、昨天没打卡的任务还在「今日」里
// 新方案:每日完成情况独立记录,任务按 freq+dueDate 判断今日是否显示
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isDoneToday(taskId){
  const t=todayStr();
  return !!(state.completions && state.completions[t] && state.completions[t][taskId]);
}
function markDoneToday(taskId){
  const t=todayStr();
  if(!state.completions) state.completions={};
  if(!state.completions[t]) state.completions[t]={};
  state.completions[t][taskId]=Date.now();
}
function unmarkDoneToday(taskId){
  const t=todayStr();
  if(state.completions && state.completions[t]) delete state.completions[t][taskId];
}
// 「今日」应该显示的任务:长期每日任务 + 到期的临时任务
function tasksForToday(){
  const t=todayStr();
  return (state.tasks||[]).filter(task=>{
    if(task.type==='长期' && task.freq==='每日') return true;
    if(task.type!=='长期') return task.dueDate===t;
    return false;
  });
}

function migrateDoneField(){
  if(!state.completions && state.tasks && state.tasks.some(t=>t.done)){
    state.completions={};
    state.completions[todayStr()]={};
    state.tasks.forEach(t=>{ if(t.done) state.completions[todayStr()][t.id]=Date.now(); });
    console.log('[迁移] 旧 t.done 已迁移到每日 completions');
  }
  // 永久任务标记 done:删除(每日刷新)
  if(state.tasks) state.tasks.forEach(t=>{ if(t.type==='长期' && t.freq==='每日') delete t.done; });
}

    const cnt=v==='全部'?ACH.length:v==='已解锁'?unlockedCount:lockedCount;
    h+=`<button class="${achFilter===v?'on':''}" onclick="setAchFilter('${v}')">${v} ${cnt}</button>`;
  });
  h+='</div>';
  const achList=ACH.filter(a=>{
    if(achFilter==='已解锁')return isAchDone(a);
    if(achFilter==='未解锁')return !isAchDone(a);
    return true;
  }).sort((a,b)=>{
    // "全部"模式下，已解锁排前面，未解锁排后面
    if(achFilter!=='全部')return 0;
    const da=isAchDone(a)?1:0, db=isAchDone(b)?1:0;
    return db-da;
  });
  if(achList.length===0){
    h+='<div class="hint" style="margin-bottom:11px">暂无此分类的成就</div>';
  }
  achList.forEach(a=>{
    const goalVal=typeof a.goal==='function'?a.goal():a.goal;
    const curVal =typeof a.cur ==='function'?a.cur() :a.cur;
    const cur  =Math.min(curVal,goalVal);
    const goal =goalVal;
    const pct  =goal>0?Math.round(cur/goal*100):0;
    const done =goal>0&&curVal>=goal;
    const left =Math.max(0,goal-curVal);
    const txt  =done?'已解锁！🎉'
               :`进度 ${cur}/${goal}${a.unit?' '+a.unit:''} · 还差 ${left}${a.unit||''}`;
    h+=`<div class="ach ${done?'unlocked':''}"><div class="arow"><div class="aico">${a.icon}</div><div><div class="an">${a.name} ${done?'✨':''}</div><div class="ad">${a.desc}</div></div></div><div class="aprog"><div class="afill" style="width:${pct}%;background:${a.color}"></div></div><div class="atxt">${txt}</div></div>`;
  });
  // 数据管理：重置存档（角落小字，避免误触）
  h+=`<div style="margin-top:18px;text-align:center;font-size:10px;color:var(--muted);opacity:.7">
    数据自动保存在本机 · <a href="#" onclick="startFresh();return false;" style="color:var(--muted);text-decoration:underline">清空并重新开始</a>
  </div>`;
  el.innerHTML=h;
  showTierInfo(TIERS.indexOf(tierFor(state.level)));
}

let calYear, calMonth, calSelectedDate;  // 月份用 0-11 表示
function initCalendar(){

function renderCalendar(){
  const el = document.getElementById('s-calendar');
  if(!el) return;
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  // 月份第一天是星期几(0=周日,1=周一...)
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayStr_ = todayStr();
  const todayDate = new Date();
  const isCurrentMonth = calYear === todayDate.getFullYear() && calMonth === todayDate.getMonth();

  // 本月完成统计
  let monthDone = 0, monthTotal = 0;
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const c = state.completions && state.completions[ds];
    if(c){
      const ids = Object.keys(c);
      monthDone += ids.length;
    }
  }
  // 本月期望任务数:长期每日任务 * 本月天数 + 当月到期的临时任务
  const longDailyCount = state.tasks.filter(t=>t.type==='长期' && t.freq==='每日').length;
  monthTotal = longDailyCount * daysInMonth;
  state.tasks.filter(t=>t.type!=='长期' && t.dueDate && t.dueDate.startsWith(`${calYear}-${String(calMonth+1).padStart(2,'0')}`))
    .forEach(()=>monthTotal++);
  const monthRate = monthTotal ? Math.round(monthDone/monthTotal*100) : 0;

  // 返回按钮(全屏日历独立入口)
  let h = `<div class="cal-back" onclick="closeCalendar()">返回今日</div>`;
  h += `<div class="sec-h">日历全览</div>`;
  h += `<div class="cal-head">
    <div class="cal-nav"><button onclick="calPrevMonth()">‹</button></div>
    <div class="cal-title">${calYear} · ${monthNames[calMonth]}</div>
    <div class="cal-nav"><button onclick="calNextMonth()">›</button></div>
  </div>`;

  // 星期表头(周一开头,符合中国习惯)
  h += `<div class="cal-weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>`;

  // 日期格子
  h += `<div class="cal-grid">`;
  // 月初偏移:把周日(0)偏移为 6,周一(1)偏移为 0
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  for(let i=0; i<offset; i++) h += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const c = state.completions && state.completions[ds];
    const doneCount = c ? Object.keys(c).length : 0;
    // 当日应有任务数(用于判定 full)
    const longToday = longDailyCount;
    const tempToday = state.tasks.filter(t=>t.type!=='长期' && t.dueDate===ds).length;
    const expectedToday = longToday + tempToday;
    const isFuture = ds > todayStr_;
    const isToday = ds === todayStr_;
    const isSelected = ds === calSelectedDate;
    const dots = Math.min(doneCount, 3);  // 最多显示 3 个点
    h += `<div class="cal-cell ${isToday?'today':''} ${isFuture?'future':''} ${isSelected?'selected':''} ${doneCount>=expectedToday && expectedToday>0 ?'full':''}" onclick="calSelectDate('${ds}')">
      <div>${d}</div>
      ${dots>0?`<div class="cal-done">${'<span></span>'.repeat(dots)}</div>`:''}
    </div>`;
  }
  h += `</div>`;

  // 图例
  h += `<div class="cal-legend">
    <span><span class="dot" style="background:var(--xp1)"></span>已完成</span>
    <span><span class="dot" style="background:var(--xp2)"></span>全清</span>
    <span><span class="dot" style="background:var(--muted)"></span>未完成</span>
  </div>`;

  h += `<div class="cal-stats">
    <div class="cs"><div class="cs-num">${monthDone}</div><div class="cs-lbl">本月完成</div></div>
    <div class="cs"><div class="cs-num">${monthTotal}</div><div class="cs-lbl">应有任务</div></div>
    <div class="cs"><div class="cs-num">${monthRate}%</div><div class="cs-lbl">完成率</div></div>
  </div>`;

  // 选中日期详情
  h += renderCalDetail(calSelectedDate);

  el.innerHTML = h;
}

function renderCalDetail(dateStr){

  const longT = state.tasks.filter(t=>t.type==='长期' && t.freq==='每日');

  const c = state.completions && state.completions[dateStr];
  const allTasks = [...longT, ...tempT];
  let h = `<div class="cal-detail">`;
  // 友好日期
  const d = new Date(dateStr);

  const friendlyDate = `${d.getMonth()+1}月${d.getDate()}日 · ${weekdays[d.getDay()]}`;

    allTasks.forEach(t=>{

function checkIn(ev,id){

  state._lastCheckDay=new Date().toDateString();

  if(todayDone()===todayTotal() && todayTotal()>0) state.streak+=1;

  let sb=STREAK_BONUSES.find(s=>s.days===state.streak);
  let sbTriggered=null;
  if(sb){
    state.coins+=sb.coins; state.xp+=(sb.xp||0); sbTriggered=sb;
    // 21/42/66 天里程碑时奖励 1 张「今天我休息」卡
    if([21,42,66].includes(state.streak)) state.restCards++;
  }
  // 属性里程碑判定（aligns with Lally 21/42/66/100 自动化曲线）
  const attrAfter=ATTRS[attrName].val;
  const msTriggered=ATTR_MILESTONES.find(m=>attrBefore<m.val && m.val<=attrAfter);
  let up=false; while(state.xp>=state.xpmax){state.xp-=state.xpmax;state.level++;state.xpmax=levelReq(state.level);up=true;}
  if(up)state.title=titleFor(state.level);
  fxFloat(x,y,`+${t.xp} EXP`,'#1f9b86'); fxFloat(x+40,y+18,`+${t.coin} 🪙`,'#f5a623'); fxCoins(x+30,y+30,3);
  updateTop();renderToday();
  // 弹窗优先级：升级 > 里程碑 > 连击奖励（升级含金量最高）
  if(up)setTimeout(()=>levelUpFX(state.level),250);
  else if(msTriggered)setTimeout(()=>attrMilestoneFX(attrName,msTriggered),300);

  triggerHaptic('medium');   // App 环境:打卡成功震动反馈
  saveState();
}

/* ========== PWA：Service Worker 注册（离线可用 + 可加主屏） ==========
 * 策略：
 * - index.html 和关键资源走 cache-first（命中即返回，保证离线可启动）
 * - 其他请求走 network-first，回退到缓存
 * - 后台发现新版本时静默更新（用户下次启动生效，不打扰）
 */
if ('serviceWorker' in navigator && !window.Capacitor?.isNativePlatform?.()) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('[PWA] Service Worker 注册成功：', reg.scope))
      .catch(err => console.warn('[PWA] Service Worker 注册失败：', err));
  });
}

/* ========== 安装引导横幅（解决小米/华为浏览器不识别 PWA 的问题） ==========
 * 策略：浏览器能装 → 显示「一键安装」按钮；浏览器不能装 → 显示切 Chrome 的提示
 * - Chrome/Edge/Samsung → 监听 beforeinstallprompt，捕获事件后等用户点按钮触发 prompt()
 * - iOS Safari → 提示分享菜单 → 添加到主屏幕
 * - 小米浏览器/华为浏览器/夸克/UC 等 → 提示复制链接换 Chrome
 * - 用户关闭过 → 7 天内不再提示
 */
(function setupInstallBanner(){
  const banner = document.getElementById('install-banner');
  const title = document.getElementById('ib-title');
  const desc = document.getElementById('ib-desc');
  const btn = document.getElementById('ib-btn');
  const closeBtn = document.getElementById('ib-close');
  if(!banner) return;

  // 在 Capacitor 原生 App 内 → 不需要安装横幅
  if(window.Capacitor?.isNativePlatform?.()){
    banner.remove();
    return;
  }

  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isAndroid = /Android/.test(ua);
  // 支持一键安装的浏览器（这些浏览器会触发 beforeinstallprompt）
  const isChromeLike = /Chrome\/\d+|Edg\/\d+|SamsungBrowser\/\d+|OPR\/\d+/.test(ua) && !/MiuiBrowser|XiaoMi\/|HuaweiBrowser|QQBrowser|UCBrowser|Quark|VivoBrowser|OppoBrowser/.test(ua);
  // 是否已经作为 PWA 运行（standalone 模式）
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  // 用户已装、用户已关过 —— 不显示
  if(isStandalone){
    banner.remove();
    return;
  }
  const dismissed = localStorage.getItem('pwa-banner-dismissed');
  if(dismissed){
    const ts = parseInt(dismissed, 10);
    if(!isNaN(ts) && Date.now() - ts < 7 * 24 * 3600 * 1000){
      banner.remove();
      return;
    }
  }

  let deferredPrompt = null;

  closeBtn.addEventListener('click', () => {
    banner.classList.add('dismissed');
    localStorage.setItem('pwa-banner-dismissed', String(Date.now()));
  });

  if(isIOS){
    title.textContent = '装到桌面,像 App 一样用';
    desc.innerHTML = '点底部 <b>分享按钮 ⬆</b> → <b>添加到主屏幕</b>。';
    btn.style.display = 'none';
  } else if(isAndroid && isChromeLike){
    title.textContent = '装到桌面,像 App 一样用';
    desc.innerHTML = '从桌面图标启动,无地址栏,可离线。';
    btn.textContent = '一键安装';
    btn.style.display = 'inline-block';
    btn.addEventListener('click', async () => {
      if(!deferredPrompt){
        desc.innerHTML = '浏览器还没准备好,请稍等再试。';
        return;
      }
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      if(choice.outcome === 'accepted'){
        banner.classList.add('dismissed');
      }
      deferredPrompt = null;
    });
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      banner.classList.remove('dismissed');
    });
    window.addEventListener('appinstalled', () => {
      banner.classList.add('dismissed');
    });
  } else if(isAndroid){
    // 小米/华为/夸克/UC 等不支持的浏览器
    title.textContent = '当前浏览器不支持一键安装';
    const browserName = (/MiuiBrowser|XiaoMi\//.test(ua) ? '小米浏览器' :
                         /HuaweiBrowser/.test(ua) ? '华为浏览器' :
                         /Quark/.test(ua) ? '夸克' :
                         /UCBrowser/.test(ua) ? 'UC' :
                         /QQBrowser/.test(ua) ? 'QQ 浏览器' :
                         /VivoBrowser/.test(ua) ? 'Vivo 浏览器' :
                         /OppoBrowser/.test(ua) ? 'OPPO 浏览器' : '当前浏览器');
    desc.innerHTML = `请复制链接,用 <b>Chrome 浏览器</b>打开,Chrome 会自动识别并提供安装按钮。`;
    btn.textContent = '复制链接';
    btn.style.display = 'inline-block';
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        btn.textContent = '✓ 已复制';
        setTimeout(() => { btn.textContent = '复制链接'; }, 2000);
      } catch(e){
        // 降级：让用户手动选择
        desc.innerHTML = '请长按地址栏复制链接,然后粘贴到 Chrome 打开。';
      }
    });
  } else {
    // 桌面浏览器
    title.textContent = '装到桌面,像 App 一样用';
    desc.innerHTML = 'Chrome 右上角 <b>⋮</b> → <b>安装 习惯进阶</b>。';
    btn.style.display = 'none';
  }

  banner.classList.remove('dismissed');
})();

/* ========== Capacitor 原生插件集成（只在 App 环境下生效） ==========
 * - Haptics：打卡成功 / 兑换成功 / 升级时震动一下
 * - StatusBar：沉浸式状态栏（颜色与 App 背景融合）
 * - LocalNotifications：每日 21:00 提醒「该打卡了」
 */
async function triggerHaptic(style){
  // style: 'light' | 'medium' | 'heavy' | 'success' | 'warning'
  if(!window.Capacitor?.isNativePlatform?.()) return;
  try {
    const { Haptics, ImpactStyle, NotificationType } = window.Capacitor.Plugins;
    const styleMap = {light: ImpactStyle.Light, medium: ImpactStyle.Medium, heavy: ImpactStyle.Heavy};
    const notifMap = {success: NotificationType.Success, warning: NotificationType.Warning};
    if(styleMap[style]) await Haptics.impact({style: styleMap[style]});
    else if(notifMap[style]) await Haptics.notification({type: notifMap[style]});
  } catch(e){ console.warn('[Haptics] 失败:', e); }
}

async function setupCapacitorPlugins(){
  if(!window.Capacitor?.isNativePlatform?.()) return;
  console.log('[Capacitor] 原生环境已检测到，初始化原生插件...');

  // 1. StatusBar：状态栏风格 + 颜色（与 App 主题融合）
  try {
    const { StatusBar, Style } = window.Capacitor.Plugins;
    await StatusBar.setStyle({style: Style.Light});   // 浅色状态栏文字
    await StatusBar.setBackgroundColor({color: '#dff7ea'});  // 与 App 顶部背景色一致
    console.log('[StatusBar] 配置完成');
  } catch(e){ console.warn('[StatusBar] 失败:', e); }

  // 2. LocalNotifications：每日 21:00 提醒「该打卡了」
  try {
    const { LocalNotifications } = window.Capacitor.Plugins;
    const perm = await LocalNotifications.requestPermissions();
    if(perm.display === 'granted'){
      // 每天 21:00 重复提醒
      const now = new Date();
      const next = new Date();
      next.setHours(21, 0, 0, 0);
      if(next <= now) next.setDate(next.getDate() + 1);   // 如果今天 21:00 已过,排明天

      await LocalNotifications.schedule({
        notifications: [{
          id: 1001,
          title: '🌱 习惯进阶',
          body: '今天的任务还没打卡,去完成它吧~',
          schedule: { at: next, repeats: true, every: 'day' },
        }]
      });
      console.log('[LocalNotifications] 每日 21:00 提醒注册完成');
    } else {
      console.log('[LocalNotifications] 用户未授权通知权限');
    }
  } catch(e){ console.warn('[LocalNotifications] 失败:', e); }
}

// App 启动时初始化原生插件
document.addEventListener('DOMContentLoaded', () => {
  if(window.Capacitor?.isNativePlatform?.()){
    setTimeout(setupCapacitorPlugins, 300);
  }
});
