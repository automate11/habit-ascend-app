name: Build Android APK

# 触发条件：
#   1. push 到 main 分支时自动构建
#   2. 手动触发（Actions 页面 → Run workflow）
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 30 分钟超时（SDK + Gradle 全套约 15 分钟）

    steps:
      # 1. 拉代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 装 Node 22（Capacitor 7 要求 Node 20+，我用 22 兼容）
      - name: 装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # 3. 装 Java 17（Capacitor 6 要求 JDK 17）
      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 装 Android SDK（cmdline-tools + platform-tools + android-35 + build-tools 35）
      - name: 装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: 接受 SDK 许可证
        run: yes | sdkmanager --licenses > /dev/null

      - name: 装 SDK 组件
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 5. 装 npm 依赖
      - name: 装 npm 依赖
        run: npm ci

      # 6. 把 web 代码同步进 Android 项目
      - name: Capacitor 同步
        run: npx cap sync android

      # 7. 打 APK
      - name: 打 Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      # 8. 上传 APK 到 GitHub Artifacts（用户可在 Actions 页面下载）
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-ascend-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30